name: Build GasTrack APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # CORREGIDO: esto faltaba, instala el SDK de Android en la ruta correcta
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        # CORREGIDO: no pisar ANDROID_HOME, GitHub ya lo pone bien con setup-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasTrack-Rocha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
